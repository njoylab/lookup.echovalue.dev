<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | echoValue lookup</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?a=11">
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-family: var(--font-mono);
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 700;
            color: var(--color-accent);
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 0 60px rgba(245, 158, 11, 0.3);
        }
        .error-title {
            font-family: var(--font-mono);
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--color-text-primary);
            margin-bottom: 1rem;
        }
        .error-message {
            color: var(--color-text-secondary);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .error-btn-primary {
            background: var(--color-accent);
            color: var(--color-bg);
        }
        .error-btn-primary:hover {
            background: var(--color-accent-hover);
            transform: translateY(-2px);
        }
        .error-btn-secondary {
            background: var(--color-card-bg);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
        }
        .error-btn-secondary:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }
    </style>
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <a class="logo" href="/" aria-label="echoValue DNS lookup">
                <span class="logo-text">echoValue</span>
                <span class="logo-separator">/</span>
                <span class="logo-accent">lookup</span>
            </a>
            <nav class="nav" role="navigation" aria-label="Main navigation">
                <a href="https://www.echovalue.dev/" target="_blank" rel="noopener noreferrer" class="nav-link">More Tools</a>
                <a href="https://github.com/njoylab/lookup.echovalue.dev" target="_blank" rel="noopener noreferrer" class="nav-link">GitHub</a>
                <a href="https://docs.echovalue.dev/dns-lookup/" target="_blank" rel="noopener noreferrer" class="nav-link">API</a>
            </nav>
        </div>
    </header>

    <main role="main">
        <div class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                The page you're looking for doesn't exist or has been moved.
                Try one of our DNS tools instead.
            </p>
            <div class="error-actions">
                <a href="/" class="error-btn error-btn-primary">
                    <span>Go Home</span>
                    <span>→</span>
                </a>
                <a href="/#tools" class="error-btn error-btn-secondary">
                    <span>View Tools</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="container">
            <div class="footer-content">
                <span>Built by <a href="https://njoylab.com" class="footer-brand" target="_blank" rel="noopener noreferrer">nJoyLab.com</a></span>
                <span class="footer-sep">·</span>
                <a href="https://www.echovalue.dev/" target="_blank" rel="noopener noreferrer">More Tools</a>
                <span class="footer-sep">·</span>
                <a href="https://github.com/njoylab/lookup.echovalue.dev" target="_blank" rel="noopener noreferrer">GitHub</a>
                <span class="footer-sep">·</span>
                <a href="/terms">Terms &amp; Conditions</a>
            </div>
        </div>
    </footer>
</body>
</html>
